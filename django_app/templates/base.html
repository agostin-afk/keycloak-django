<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Keycloak + Django Demo{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header h1 span { color: var(--accent); }
    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.95rem;
      transition: color 0.15s;
    }
    nav a:hover { color: var(--text); }
    main {
      max-width: 720px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.35rem; margin-bottom: 0.75rem; }
    .card p { color: var(--muted); margin-bottom: 1rem; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: 0.65rem 1.4rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .badge {
      display: inline-block;
      background: #1e3a5f;
      color: #93c5fd;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
      margin-right: 0.4rem;
      margin-bottom: 0.3rem;
    }
    .badge.admin { background: #3b1d1d; color: #fca5a5; }
    .badge.auditor { background: #1e3a2f; color: #86efac; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    code, pre {
      background: #0d1117;
      border-radius: 6px;
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-size: 0.85rem;
    }
    pre { padding: 1rem; overflow-x: auto; margin-top: 0.75rem; border: 1px solid var(--border); }
    .status { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); }
    footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 2rem; }
  </style>
</head>
<body>
  <header>
    <h1>Keycloak <span>+</span> Django</h1>
    <nav>
      <a href="/">Início</a>
      {% if user.is_authenticated %}
        <a href="/protegido/">Área protegida</a>
        <a href="/logout/">Sair</a>
      {% else %}
        <a href="/login/">Entrar com Keycloak</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Demo para Sistemas Distribuídos · Keycloak + OpenID Connect
  </footer>
</body>
</html>
